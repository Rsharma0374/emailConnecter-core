apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-connector
  namespace: email-connector
spec:
  selector:
    matchLabels:
      app: email-connector
  replicas: 3
  template:
    metadata:
      labels:
        app: email-connector
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: email-connector-config-volume
          configMap:
            name: email-connector-config
        - name: log-volume
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: email-connector
          image: rsharma0374/email-connector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: email-connector-config-volume
              mountPath: /opt/configs
              readOnly: true
            - name: log-volume
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 10002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10002
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: SPRING_APPLICATION_JSON
              value: '{
                "server": {
                  "port": 10002,
                  "address": "0.0.0.0"
                },
                "spring": {
                  "application": {
                    "name": "EMAIL-SERVICE"
                  }
                },
                "eureka": {
                  "client": {
                    "serviceUrl": {
                      "defaultZone": "http://eureka-0.eureka.email-connector.svc.cluster.local:8761/eureka"
                    },
                    "register-with-eureka": true,
                    "fetch-registry": true
                  },
                  "instance": {
                    "prefer-ip-address": true,
                    "instanceId": "${spring.cloud.client.hostname}:${spring.application.name}:${server.port}"
                  }
                }
              }'